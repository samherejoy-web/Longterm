defaults:
  - _self_

model:
  vocab_size: 32000
  d_model: 128
  n_layers: 2
  n_heads: 4
  block_variant: hope_attention
  dropout: 0.0
  
data:
  batch_size: 2
  seq_length: 128
  
train:
  steps: 50
  log_interval: 10
  checkpoint_interval: 50
  device: cpu
  seed: 42
  
optim:
  type: adamw
  lr: 0.0003
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  
logging:
  enabled: false
